[project]
name = "plano-v2"
version = "0.1.0"
description = "Wildfire prevention prioritization tool for Portuguese municipalities (data-first)"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "shapely>=2.0",
    "numpy",
    "pillow",
    "rasterio",
    "scipy",
    "lightgbm",
    "scikit-learn",
    "matplotlib",
    "pyshp",
    "pyproj",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plano_v2"]
